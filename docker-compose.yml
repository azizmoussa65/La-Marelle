# Base de données PostgreSQL de La Marelle
#   Mot de passe : fichier .env à la racine (POSTGRES_PASSWORD=..., non versionné)
#   Démarrer : docker compose up -d
#   Arrêter  : docker compose down        (les données sont conservées dans le volume)
# Port 5434 sur le PC (5432 et 5433 sont déjà utilisés par d'autres projets)
name: lamarellekids
services:
  db:
    image: postgres:16-alpine
    container_name: lamarellekids-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lamarellekids
      POSTGRES_USER: lamarellekids
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD dans le fichier .env}
    ports:
      - "5434:5432"
    volumes:
      - lamarellekids-data:/var/lib/postgresql/data

volumes:
  lamarellekids-data:
